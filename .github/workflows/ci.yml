# nathwn12 house CI — stack: static HTML/JS site (copy to .github/workflows/ci.yml)
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: if (Test-Path package.json) { npm ci }
        shell: pwsh
      - run: if (Test-Path package.json) { npm run build --if-present }
        shell: pwsh
      # Tracked, pure-Node QA (no browser, no audio device). Keeps the
      # feed/program-reset regressions enforced in CI; tests/ and the rest
      # of qa/ stay local-only per AGENTS.md.
      - run: node qa/feed-transition-qa.cjs
        shell: pwsh
      - run: node qa/program-boundary-qa.cjs
        shell: pwsh
      - run: npx --yes htmlhint --config .htmlhintrc "**/*.html" 2>$null || npx --yes htmlhint "**/*.html"
